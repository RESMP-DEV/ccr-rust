name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

      - name: Enforce dependency policy
        run: cargo deny check

  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --release --all-features

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Test documentation
        run: cargo test --locked --doc --all-features
