name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

      - name: Enforce dependency policy
        run: cargo deny check

  build:
    needs: audit
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --features openssl/vendored

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="ccr-rust-${tag}-${{ matrix.target }}.tar.gz"
          staging="ccr-rust-${tag}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ccr-rust" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$archive" "$staging"
          echo "ASSET=$archive" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "ccr-rust-$tag-${{ matrix.target }}.zip"
          $staging = "ccr-rust-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/ccr-rust.exe" $staging
          Copy-Item "README.md" $staging
          Copy-Item "LICENSE" $staging
          Compress-Archive -Path $staging -DestinationPath $archive
          "ASSET=$archive" >> $env:GITHUB_ENV

      - name: Generate checksum
        if: runner.os != 'Windows'
        run: shasum -a 256 "$ASSET" > "$ASSET.sha256"

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -Encoding ascii "$env:ASSET.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.sha256
